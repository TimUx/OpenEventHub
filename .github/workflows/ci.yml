name: Foundation CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Shared package tests
        run: npm run test --workspace=@openeventhub/shared

      - name: Database package validate and tests
        run: |
          npm run validate --workspace=@openeventhub/database
          npm run test --workspace=@openeventhub/database

      - name: Validate Docker Compose files
        run: npm run validate:compose

      - name: Validate Docker Stack file
        run: npm run validate:stack
