# OpenEventHub — Docker Stack (Swarm) skeleton
# Production target per docs/DOCKER_STACK.md / docs/DEPLOYMENT.md.
# Secrets and configs are placeholders for M11 hardening; do not deploy as-is
# without replacing credentials.

networks:
  edge:
    driver: overlay
    attachable: true
  internal:
    driver: overlay
    internal: true
    attachable: true

volumes:
  postgres_data:
  redis_data:
  object_storage_data:

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  s3_secret_key:
    external: true

services:
  traefik:
    image: traefik:v3.6.7
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=openeventhub_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --api.dashboard=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openeventhub
      POSTGRES_DB: openeventhub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.oeh.storage == true
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openeventhub -d openeventhub']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:4.40
    entrypoint:
      - /bin/sh
      - -c
      - |
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)"
        exec /entrypoint.sh
    environment:
      AWS_ACCESS_KEY_ID: openeventhub
      S3_BUCKET: openeventhub
    secrets:
      - s3_secret_key
    volumes:
      - object_storage_data:/data
    networks:
      - internal
      - edge
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.oeh.storage == true
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
