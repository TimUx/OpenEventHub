# OpenEventHub monitoring overlay (Prometheus / Grafana / Loki / Promtail)
# Docs: docs/MONITORING.md
#
# With Compose apps:
#   docker compose -f docker/compose/docker-compose.yml \
#     -f docker/compose/docker-compose.apps.yml \
#     -f docker/monitoring/docker-compose.monitoring.yml \
#     --env-file .env up -d
#
# Validate:
#   npm run validate:monitoring

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: oeh-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
      - edge
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    container_name: oeh-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - internal
    ports:
      - '${LOKI_PORT:-3100}:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.4.2
    container_name: oeh-promtail
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    container_name: oeh-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - internal
      - edge
    ports:
      - '${GRAFANA_PORT:-3300}:3000'
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

networks:
  edge:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-openeventhub}_edge
  internal:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-openeventhub}_internal

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
