# Application services (Milestone 2+)
# Usage:
#   docker compose -f docker/compose/docker-compose.yml -f docker/compose/docker-compose.apps.yml --env-file .env up -d --build
#
# Network policy:
#   - Workers / data plane → internal only
#   - Traefik-routed surfaces (api, frontend, admin) → edge (+ internal when they need DB/Redis)

x-nestjs-worker: &nestjs-worker
  restart: unless-stopped
  networks:
    - internal
  # Reach host-published LLM endpoints (e.g. Ollama on 0.0.0.0:11434) via host.docker.internal.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  environment: &nestjs-env
    NODE_ENV: ${NODE_ENV:-development}
    SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    POSTGRES_HOST: postgres
    POSTGRES_PORT_INTERNAL: 5432
    REDIS_HOST: redis
    REDIS_PORT_INTERNAL: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
    OBJECT_STORAGE_HOST: object-storage
    OBJECT_STORAGE_PORT_INTERNAL: 8333
    S3_ENDPOINT: http://object-storage:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openeventhub}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-openeventhub_change_me}
    S3_BUCKET: ${S3_BUCKET:-openeventhub}
    DATABASE_URL: postgresql://${POSTGRES_USER:-openeventhub}:${POSTGRES_PASSWORD:-openeventhub_change_me}@postgres:5432/${POSTGRES_DB:-openeventhub}
    SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-dev-only-change-me-settings-key}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me-auth-jwt-secret}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *nestjs-worker
    image: openeventhub/api:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: oeh-api
    networks:
      - edge
      - internal
    environment:
      <<: *nestjs-env
      PORT: 3000
      SERVICE_NAME: api
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      API_RATE_LIMIT_TTL_MS: ${API_RATE_LIMIT_TTL_MS:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://admin.localhost:8088}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8088}
    labels:
      - traefik.enable=true
      - traefik.docker.network=openeventhub_edge
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000

  scheduler:
    <<: *nestjs-worker
    image: openeventhub/scheduler:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    container_name: oeh-scheduler
    environment:
      <<: *nestjs-env
      PORT: 3001
      SERVICE_NAME: scheduler
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}

  worker:
    <<: *nestjs-worker
    image: openeventhub/worker:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    container_name: oeh-worker
    # edge: Nominatim outbound; internal: Postgres/Redis
    networks:
      - edge
      - internal
    environment:
      <<: *nestjs-env
      PORT: 3002
      SERVICE_NAME: worker
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-OpenEventHub/0.24 (geocoding; https://github.com/TimUx/OpenEventHub)}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  crawler:
    <<: *nestjs-worker
    image: openeventhub/crawler:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/crawler/Dockerfile
    container_name: oeh-crawler
    networks:
      - edge
      - internal
    environment:
      <<: *nestjs-env
      PORT: 3003
      SERVICE_NAME: crawler
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      PLUGINS_DIR: /app/plugins
      OBJECT_STORAGE_ADAPTER: s3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  ai-service:
    <<: *nestjs-worker
    image: openeventhub/ai-service:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    container_name: oeh-ai-service
    networks:
      - edge
      - internal
    environment:
      <<: *nestjs-env
      PORT: 3004
      SERVICE_NAME: ai-service
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      PROMPTS_DIR: /app/prompts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ocr-service:
    <<: *nestjs-worker
    image: openeventhub/ocr-service:${SERVICE_VERSION:-0.5.0}
    build:
      context: ../..
      dockerfile: services/ocr-service/Dockerfile
    container_name: oeh-ocr-service
    networks:
      - edge
      - internal
    environment:
      <<: *nestjs-env
      PORT: 3005
      SERVICE_NAME: ocr-service
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      OBJECT_STORAGE_ADAPTER: s3
    depends_on:
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  search:
    <<: *nestjs-worker
    image: openeventhub/search:${SERVICE_VERSION:-0.1.0}
    build:
      context: ../..
      dockerfile: services/search/Dockerfile
    container_name: oeh-search
    environment:
      <<: *nestjs-env
      PORT: 3006
      SERVICE_NAME: search

  frontend:
    image: openeventhub/frontend:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8088}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8088}
    container_name: oeh-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      PORT: 3100
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8088}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8088}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=openeventhub_edge
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=3100
    depends_on:
      api:
        condition: service_healthy

  admin:
    image: openeventhub/admin:${SERVICE_VERSION:-0.26.0}
    build:
      context: ../..
      dockerfile: services/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8088}
        NEXT_PUBLIC_ADMIN_TITLE: ${NEXT_PUBLIC_ADMIN_TITLE:-}
        NEXT_PUBLIC_ADMIN_LOGO_URL: ${NEXT_PUBLIC_ADMIN_LOGO_URL:-}
    container_name: oeh-admin
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.26.0}
      PORT: 3101
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8088}
      NEXT_PUBLIC_ADMIN_TITLE: ${NEXT_PUBLIC_ADMIN_TITLE:-}
      NEXT_PUBLIC_ADMIN_LOGO_URL: ${NEXT_PUBLIC_ADMIN_LOGO_URL:-}
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=openeventhub_edge
      - traefik.http.routers.admin.rule=Host(`admin.${DOMAIN:-localhost}`)
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=3101
    depends_on:
      api:
        condition: service_healthy

  migrate:
    profiles: ['tools']
    image: node:22-bookworm
    container_name: oeh-migrate
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openeventhub}:${POSTGRES_PASSWORD:-openeventhub_change_me}@postgres:5432/${POSTGRES_DB:-openeventhub}
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command:
      - bash
      - -lc
      - npm run db:generate && npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
