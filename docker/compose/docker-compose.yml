# OpenEventHub — Docker Compose (development / single-node)
# Infrastructure foundation only (M1). Application services arrive in M2+.
#
# Usage:
#   cp .env.example .env
#   docker compose -f docker/compose/docker-compose.yml --env-file .env up -d
#   npm run infra:health

name: openeventhub

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  traefik_letsencrypt:

services:
  traefik:
    image: traefik:v3.6.7
    container_name: oeh-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=openeventhub_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '${TRAEFIK_HTTP_PORT:-8088}:80'
      - '${TRAEFIK_HTTPS_PORT:-8443}:443'
      - '${TRAEFIK_DASHBOARD_PORT:-18080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.entrypoints=web

  postgres:
    image: postgres:16-alpine
    container_name: oeh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openeventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openeventhub_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-openeventhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
      - edge
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-openeventhub} -d ${POSTGRES_DB:-openeventhub}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: oeh-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_change_me}
      - --appendonly
      - 'yes'
    volumes:
      - redis_data:/data
    networks:
      - internal
      - edge
    ports:
      - '${REDIS_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}

  object-storage:
    image: chrislusf/seaweedfs:4.40
    container_name: oeh-object-storage
    restart: unless-stopped
    # Default entrypoint runs `weed mini` (master + volume + filer + S3 + admin).
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-openeventhub}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-openeventhub_change_me}
      S3_BUCKET: ${S3_BUCKET:-openeventhub}
    volumes:
      - object_storage_data:/data
    networks:
      - internal
      - edge
    ports:
      - '${S3_API_PORT:-18333}:8333'
      - '${SEAWEED_ADMIN_PORT:-23646}:23646'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.object-storage-s3.rule=Host(`s3.${DOMAIN:-localhost}`)
      - traefik.http.routers.object-storage-s3.entrypoints=web
      - traefik.http.routers.object-storage-s3.service=object-storage-s3
      - traefik.http.services.object-storage-s3.loadbalancer.server.port=8333
      - traefik.http.routers.object-storage-admin.rule=Host(`storage-admin.${DOMAIN:-localhost}`)
      - traefik.http.routers.object-storage-admin.entrypoints=web
      - traefik.http.routers.object-storage-admin.service=object-storage-admin
      - traefik.http.services.object-storage-admin.loadbalancer.server.port=23646
