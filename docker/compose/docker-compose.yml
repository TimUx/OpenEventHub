# OpenEventHub — Docker Compose (development / single-node)
# Infrastructure foundation only (M1). Application services arrive in M2+.
#
# Usage:
#   cp .env.example .env
#   docker compose -f docker/compose/docker-compose.yml --env-file .env up -d
#   npm run infra:health

name: openeventhub

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  traefik_letsencrypt:

services:
  traefik:
    image: traefik:v3.3
    container_name: oeh-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=openeventhub_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '${TRAEFIK_HTTP_PORT:-8088}:80'
      - '${TRAEFIK_HTTPS_PORT:-8443}:443'
      - '${TRAEFIK_DASHBOARD_PORT:-18080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.entrypoints=web

  postgres:
    image: postgres:16-alpine
    container_name: oeh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openeventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openeventhub_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-openeventhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
      - edge
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-openeventhub} -d ${POSTGRES_DB:-openeventhub}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: oeh-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_change_me}
      - --appendonly
      - 'yes'
    volumes:
      - redis_data:/data
    networks:
      - internal
      - edge
    ports:
      - '${REDIS_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: oeh-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    volumes:
      - minio_data:/data
    networks:
      - internal
      - edge
    ports:
      - '${MINIO_API_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`minio.${DOMAIN:-localhost}`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.services.minio.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`minio-console.${DOMAIN:-localhost}`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: oeh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-openeventhub}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/$${MINIO_BUCKET}/public" || true
        echo "MinIO bucket $${MINIO_BUCKET} ready"
    networks:
      - internal
    restart: 'no'
